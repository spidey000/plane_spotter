services:
  plane-spotter:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: plane-spotter:local
    container_name: plane-spotter
    init: true
    restart: unless-stopped
    environment:
      ADMIN_USER_ID: ${ADMIN_USER_ID:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_SCHEMA: ${SUPABASE_SCHEMA:-public}
      SUPABASE_CONFIG_ENABLED: ${SUPABASE_CONFIG_ENABLED:-false}
      SUPABASE_CONFIG_TABLE: ${SUPABASE_CONFIG_TABLE:-app_config}
      SUPABASE_CONFIG_CACHE_SECONDS: ${SUPABASE_CONFIG_CACHE_SECONDS:-60}
      SUPABASE_CONFIG_TIMEOUT_SECONDS: ${SUPABASE_CONFIG_TIMEOUT_SECONDS:-20}
      AEROAPI_KEY: ${AEROAPI_KEY:-}
      AEROAPI_KEYS: ${AEROAPI_KEYS:-}
      AEROAPI_MONTHLY_BUDGET_USD: ${AEROAPI_MONTHLY_BUDGET_USD:-5}
      AEROAPI_USAGE_CACHE_TTL_SECONDS: ${AEROAPI_USAGE_CACHE_TTL_SECONDS:-600}
      AERODATABOX_KEY: ${AERODATABOX_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      BLUESKY_HANDLE: ${BLUESKY_HANDLE:-}
      BLUESKY_PASSWORD: ${BLUESKY_PASSWORD:-}
      X_ACCESS_TOKEN: ${X_ACCESS_TOKEN:-}
      X_ACCESS_TOKEN_SECRET: ${X_ACCESS_TOKEN_SECRET:-}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
      X_USAGE_SYNC_ENABLED: ${X_USAGE_SYNC_ENABLED:-true}
      X_USAGE_SYNC_DAYS: ${X_USAGE_SYNC_DAYS:-7}
    volumes:
      - logs-data:/app/logs
      - config-data:/app/config
    command: ["python", "main.py"]

volumes:
  logs-data:
  config-data:
